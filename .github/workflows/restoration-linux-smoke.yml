name: Restoration Linux startup smoke

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  linux-smoke:
    runs-on: ubuntu-24.04
    env:
      PRODUCTION_PYTHON: "3.14.3"
    timeout-minutes: 15
    steps:
      - name: Require the same-repository restoration PR
        env:
          SELECTED_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          test "$SELECTED_BRANCH" = codex/content-pack-complete-image-restore
          test "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"

      - name: Check out explicit PR head (not the synthetic merge)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: subject
          fetch-depth: 0
          persist-credentials: false

      - name: Verify and report application revision
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git -C subject rev-parse HEAD)" = "$PR_HEAD_SHA"
          git -C subject merge-base --is-ancestor 608391b1c2e03dc166f1042a11706cfcca389c27 HEAD
          echo "Application revision: $PR_HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Checkout: PR head; synthetic merge is not tested." >> "$GITHUB_STEP_SUMMARY"
          echo "Runtime: Ubuntu 24.04 / Python 3.14.3" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up production Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ env.PRODUCTION_PYTHON }}
          architecture: x64

      - name: Install committed dependencies in a clean environment
        run: |
          python -c 'import os, platform; assert platform.python_version() == os.environ["PRODUCTION_PYTHON"]'
          python -m venv "$RUNNER_TEMP/smu-smoke-venv"
          "$RUNNER_TEMP/smu-smoke-venv/bin/python" -m pip --isolated install --no-cache-dir --index-url https://pypi.org/simple -r subject/requirements.txt
          "$RUNNER_TEMP/smu-smoke-venv/bin/python" -m pip --isolated check

      - name: Exercise application with loopback-only networking and dummy configuration
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/smu-smoke-state"
          # New network namespace has no external interfaces/routes. Failure to
          # create it is fatal; never fall back to unrestricted application checks.
          python_library_dir=$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')
          sudo unshare --net -- bash -euo pipefail -c '
            ip link set lo up
            exec env -i PATH=/usr/bin:/bin PYTHONDONTWRITEBYTECODE=1 \
              LD_LIBRARY_PATH="$5" SMU_SMOKE_MODE=1 \
              SMU_SMOKE_ROOT="$1" SMU_SMOKE_STATE="$2" SMU_SMOKE_SUBJECT="$6" \
              PYTHONPATH="$3" "$4" "$3/linux_smoke.py"
          ' smoke "$PWD/subject" "$RUNNER_TEMP/smu-smoke-state" \
            "$PWD/subject/scripts/ci" "$RUNNER_TEMP/smu-smoke-venv/bin/python" \
            "$python_library_dir" "$PR_HEAD_SHA"

      - name: Report isolated smoke result
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/smu-smoke-state/result.json"; then
            cat "$RUNNER_TEMP/smu-smoke-state/result.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Smoke did not complete; inspect the failed step. Linux compatibility is not established.' >> "$GITHUB_STEP_SUMMARY"
          fi
