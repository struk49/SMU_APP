{% extends "base.html" %}

{% block title %}Checkout Canceled · SMU{% endblock %}

{% block content %}
<section class="py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <h1 class="h2 mb-3">Checkout canceled</h1>
            <p class="text-muted">
                No payment was completed and no subscription changes were made.
                You can return to pricing and start checkout again when you're ready.
            </p>
            <a href="{{ url_for('pricing') }}" class="btn btn-primary">
                Return to Pricing
            </a>
        </div>
    </div>
</section>
{% endblock %}
