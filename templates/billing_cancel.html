{% extends "base.html" %}

{% block title %}Subscription Cancelled · SMU{% endblock %}

{% block content %}
<section class="py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <h1 class="h2 mb-3">Checkout cancelled</h1>
            <p class="text-muted">
                No subscription changes were made. You can return to SMU and
                start checkout again when you're ready.
            </p>
            <a href="{{ url_for('index') }}" class="btn btn-primary">
                Return to Dashboard
            </a>
        </div>
    </div>
</section>
{% endblock %}
