{% if post.status == 'draft' %}
    <span class="badge bg-secondary">Draft</span>
{% elif post.status == 'scheduled' %}
    <span class="badge bg-warning text-dark">Scheduled</span>
{% elif post.status == 'sent_to_make' %}
    <span class="badge bg-success">Publishing</span>
{% elif post.status == 'generating' %}
    <span class="badge bg-info text-dark">Generating</span>
{% elif post.status == 'generation_failed' %}
    <span class="badge bg-danger">Generation Failed</span>
{% else %}
    <span class="badge bg-secondary">{{ post.status|title }}</span>
{% endif %}
